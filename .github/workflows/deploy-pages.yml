name: Deploy to GitHub Pages

# Deploy from the feature branch only. The GitHub Pages environment permits
# deployments from the repository's default branch (this feature branch); a
# push to another branch (e.g. main) would build fine but fail the deploy on
# the environment's branch policy, so it is intentionally not a trigger here.
on:
  push:
    branches:
      - claude/poker-outs-trainer-ue1fau
  workflow_dispatch:

# Permissions required for the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress deploy (avoids a
# concurrent push cancelling the run that actually publishes the site).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run engine tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure Pages
        # Enables GitHub Pages (build type "workflow") automatically if it has
        # not been turned on yet, so no manual repo-settings step is needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
